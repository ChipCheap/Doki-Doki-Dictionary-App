<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doki-Doki Dictionary</title>
    <meta name="description" content="Learn vocabulary with spaced repetition. Works offline." />

    <!--
      Paired so the browser chrome follows the mode. The manifest's theme_color
      is a single value and only sets the splash screen; without these the bar
      above the app shows the wrong background in one of the two modes.
    -->
    <meta name="theme-color" content="#F7F1E4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1613" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
